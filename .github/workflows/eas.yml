# Plain EAS build, no Firebase upload. Useful when you just want a build
# link on expo.dev (e.g. for QA download) without notifying any testers.
#
# For the standard release flow (build + notify testers + tag + release),
# use release.yml — auto-triggered by bumping app.json's expo.version.
name: eas

on:
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile
        required: true
        default: preview
        type: choice
        options: [preview, production]

jobs:
  build:
    name: EAS build (${{ github.event.inputs.profile || 'preview' }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Expo token
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "::error::Missing EXPO_TOKEN — create at https://expo.dev/settings/access-tokens"
            exit 1
          fi

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build on EAS
        env:
          EXPO_PUBLIC_API_URL: https://cash-flow.saffron.waw.pl/api
        run: |
          PROFILE="${{ github.event.inputs.profile || 'preview' }}"
          eas build --profile "$PROFILE" --platform all --non-interactive
