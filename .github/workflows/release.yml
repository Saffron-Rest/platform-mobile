# Continuous-delivery for the Saffron Cashier mobile app.
#
# Trigger: any push to main that bumps `expo.version` in `app.json`.
# Action:  builds on EAS → uploads to Firebase App Distribution → tags
#          the commit `v<X.Y.Z>` → opens a GitHub Release.
#
# Why version-gated instead of "every push": EAS free tier has 30 builds /
# month. A version bump is the single intentional signal that "this is a
# release", so we only burn build minutes when a human says we should.
#
# Required GitHub repository secrets:
#   EXPO_TOKEN                 https://expo.dev/settings/access-tokens
#   FIREBASE_SERVICE_ACCOUNT   full JSON of a service account with role
#                              "Firebase App Distribution Admin"
#   FIREBASE_APP_ID_ANDROID    `1:…:android:…`
#   FIREBASE_APP_ID_IOS        `1:…:ios:…`    (optional — fail-fast if missing)
#
# Optional repo *variables*:
#   FIREBASE_GROUPS            comma-separated tester groups (default: testers)
#   RELEASE_PLATFORMS          android | ios | all                (default: android)
#
# Manual override: workflow_dispatch is also wired up so you can force a
# release without bumping the version — useful for hotfixes / re-runs.
name: release

on:
  push:
    branches: [main, master]
    paths:
      - app.json
      - .github/workflows/release.yml
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to release
        required: true
        default: android
        type: choice
        options: [android, ios, all]
      profile:
        description: EAS profile (preview = internal APK; production = store-ready)
        required: true
        default: preview
        type: choice
        options: [preview, production]
      force:
        description: Run even if the version did not change
        required: false
        default: false
        type: boolean

permissions:
  contents: write       # tag + create release
  actions: read

concurrency:
  group: mobile-release
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------- #
  # 1. Detect whether this push actually bumped the version.               #
  # ---------------------------------------------------------------------- #
  detect:
    name: Detect version bump
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      changed: ${{ steps.diff.outputs.changed }}
      platforms: ${{ steps.platforms.outputs.list }}
      profile: ${{ steps.platforms.outputs.profile }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: read
        name: Read app.json version
        run: |
          VERSION=$(jq -r '.expo.version' app.json)
          if [[ -z "$VERSION" || "$VERSION" == "null" ]]; then
            echo "::error::expo.version is missing in app.json"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "→ current version: $VERSION"

      - id: diff
        name: Did the version change?
        env:
          FORCE: ${{ github.event.inputs.force }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "$FORCE" == "true" ]]; then
            echo "→ manual override (force=true)"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          PREV=$(git show HEAD~1:app.json 2>/dev/null | jq -r '.expo.version' 2>/dev/null || echo "")
          CURR="${{ steps.read.outputs.version }}"
          if [[ "$PREV" != "$CURR" ]]; then
            echo "→ version changed: ${PREV:-<none>} → $CURR"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "→ version unchanged ($CURR) — skipping build"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - id: platforms
        name: Resolve platform matrix
        env:
          DISPATCH_PLATFORM: ${{ github.event.inputs.platform }}
          DISPATCH_PROFILE: ${{ github.event.inputs.profile }}
          DEFAULT_PLATFORMS: ${{ vars.RELEASE_PLATFORMS || 'android' }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            SELECTED="$DISPATCH_PLATFORM"
            PROFILE="$DISPATCH_PROFILE"
          else
            SELECTED="$DEFAULT_PLATFORMS"
            PROFILE="preview"
          fi
          if [[ "$SELECTED" == "all" ]]; then
            echo 'list=["android","ios"]' >> "$GITHUB_OUTPUT"
          else
            echo "list=[\"$SELECTED\"]" >> "$GITHUB_OUTPUT"
          fi
          echo "profile=$PROFILE" >> "$GITHUB_OUTPUT"
          echo "→ platforms: $SELECTED · profile: $PROFILE"

  # ---------------------------------------------------------------------- #
  # 2. Build on EAS + push to Firebase App Distribution.                   #
  # ---------------------------------------------------------------------- #
  release:
    name: ${{ matrix.platform }} → Firebase v${{ needs.detect.outputs.version }}
    needs: detect
    if: needs.detect.outputs.changed == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.detect.outputs.platforms) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify required secrets
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_APP_ID_ANDROID: ${{ secrets.FIREBASE_APP_ID_ANDROID }}
          FIREBASE_APP_ID_IOS: ${{ secrets.FIREBASE_APP_ID_IOS }}
        run: |
          missing=""
          [[ -z "$EXPO_TOKEN" ]]               && missing="$missing EXPO_TOKEN"
          [[ -z "$FIREBASE_SERVICE_ACCOUNT" ]] && missing="$missing FIREBASE_SERVICE_ACCOUNT"
          if [[ "${{ matrix.platform }}" == "android" && -z "$FIREBASE_APP_ID_ANDROID" ]]; then
            missing="$missing FIREBASE_APP_ID_ANDROID"
          fi
          if [[ "${{ matrix.platform }}" == "ios" && -z "$FIREBASE_APP_ID_IOS" ]]; then
            missing="$missing FIREBASE_APP_ID_IOS"
          fi
          if [[ -n "$missing" ]]; then
            cat >&2 <<EOF
          ::error::Missing required secrets for the ${{ matrix.platform }} release:$missing
                   Add them at Settings → Secrets and variables → Actions.
                   If iOS isn't ready yet, set the repo variable RELEASE_PLATFORMS=android
                   so the auto-trigger skips iOS entirely.
          EOF
            exit 1
          fi

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Compose release notes
        id: notes
        env:
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          PREV_TAG=$(git tag --list 'v*' --sort=-v:refname | head -n1 || true)
          if [[ -n "$PREV_TAG" ]]; then
            COMMITS=$(git log --no-merges --pretty=format:"- %s" "$PREV_TAG"..HEAD || true)
            RANGE_NOTE="changes since $PREV_TAG"
          else
            COMMITS=$(git log --no-merges --pretty=format:"- %s" -n 20 || true)
            RANGE_NOTE="last 20 commits"
          fi
          [[ -z "$COMMITS" ]] && COMMITS="- Maintenance release"
          NOTES="Saffron Cashier v${VERSION} (${RANGE_NOTE}):

          ${COMMITS}"
          NOTES="${NOTES:0:15000}"
          {
            echo "body<<NOTES_EOF"
            echo "$NOTES"
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build on EAS
        env:
          EXPO_PUBLIC_API_URL: https://cash-flow.saffron.waw.pl/api
        run: |
          npx eas build \
            --profile "${{ needs.detect.outputs.profile }}" \
            --platform "${{ matrix.platform }}" \
            --non-interactive \
            --wait

      - name: Resolve latest build artifact
        id: artifact
        run: |
          BUILD_JSON=$(npx eas build:list \
            --status finished \
            --limit 1 \
            --platform "${{ matrix.platform }}" \
            --non-interactive \
            --json)
          URL=$(echo "$BUILD_JSON" | jq -r '.[0].artifacts.buildUrl // .[0].artifacts.applicationArchiveUrl // empty')
          VERSION=$(echo "$BUILD_JSON" | jq -r '.[0].appVersion // empty')
          if [[ -z "$URL" ]]; then
            echo "::error::EAS reported no finished build URL"
            exit 1
          fi
          EXT="apk"
          [[ "${{ matrix.platform }}" == "ios" ]] && EXT="ipa"
          mkdir -p dist
          OUT="dist/saffron-cashier-${{ matrix.platform }}-${VERSION:-${{ needs.detect.outputs.version }}}.$EXT"
          curl -L --fail --silent --show-error -o "$OUT" "$URL"
          echo "file=$OUT" >> "$GITHUB_OUTPUT"

      - name: Pick Firebase App ID
        id: appid
        env:
          ANDROID_APP_ID: ${{ secrets.FIREBASE_APP_ID_ANDROID }}
          IOS_APP_ID: ${{ secrets.FIREBASE_APP_ID_IOS }}
        run: |
          if [[ "${{ matrix.platform }}" == "android" ]]; then
            echo "id=$ANDROID_APP_ID" >> "$GITHUB_OUTPUT"
          else
            echo "id=$IOS_APP_ID" >> "$GITHUB_OUTPUT"
          fi

      - name: Distribute to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ steps.appid.outputs.id }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: ${{ vars.FIREBASE_GROUPS || 'testers' }}
          file: ${{ steps.artifact.outputs.file }}
          releaseNotes: ${{ steps.notes.outputs.body }}

      - name: Upload artifact to workflow run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saffron-cashier-${{ matrix.platform }}-v${{ needs.detect.outputs.version }}
          path: ${{ steps.artifact.outputs.file }}
          if-no-files-found: warn
          retention-days: 30

  # ---------------------------------------------------------------------- #
  # 3. After all platforms succeed, tag the commit and open a GitHub       #
  #    Release so the version is permanently anchored.                     #
  # ---------------------------------------------------------------------- #
  tag-and-release:
    name: Tag v${{ needs.detect.outputs.version }}
    needs: [detect, release]
    if: needs.detect.outputs.changed == 'true' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create tag if absent
        env:
          VERSION: ${{ needs.detect.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$VERSION"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "→ tag $TAG already exists, skipping"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Saffron Cashier v$VERSION"
          git push origin "$TAG"
          echo "→ tagged $TAG"

      - name: Generate release notes
        id: notes
        env:
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          PREV_TAG=$(git tag --list 'v*' --sort=-v:refname | sed -n '2p' || true)
          if [[ -n "$PREV_TAG" ]]; then
            COMMITS=$(git log --no-merges --pretty=format:"- %s (%h)" "$PREV_TAG"..HEAD || true)
            RANGE="since $PREV_TAG"
          else
            COMMITS=$(git log --no-merges --pretty=format:"- %s (%h)" -n 20 || true)
            RANGE="first 20 commits"
          fi
          [[ -z "$COMMITS" ]] && COMMITS="- Maintenance release"
          {
            echo "body<<NOTES_EOF"
            echo "**Saffron Cashier v$VERSION** — $RANGE"
            echo ""
            echo "$COMMITS"
            echo ""
            echo "_Distributed via Firebase App Distribution to the \`${{ vars.FIREBASE_GROUPS || 'testers' }}\` group(s)._"
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.detect.outputs.version }}
          name: Saffron Cashier v${{ needs.detect.outputs.version }}
          body: ${{ steps.notes.outputs.body }}
          draft: false
          prerelease: false
          generate_release_notes: false
